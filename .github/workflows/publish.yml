name: Render and publish segment videos

# Renders any curriculum segment whose inputs changed (narration is only synthesized for cues whose
# words changed), publishes changed renders to YouTube, commits the results, and redeploys the site.
on:
  schedule:
    - cron: "0 6 * * *"          # nightly, 06:00 UTC
  workflow_dispatch:
    inputs:
      segment:
        description: "Segment to build and publish (e.g. S06) or all"
        default: all
        required: false
      force:
        description: "Re-render even if unchanged"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "curriculum/video/**/cues.json"
      - "curriculum/video/**/assets/**"
      - "curriculum/video/**/voice/**"
      - "curriculum/video/render.py"
      - "curriculum/video/publish.py"

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-videos
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: curriculum/video/requirements.txt

      - name: Install
        run: pip install -r curriculum/video/requirements.txt

      - name: Render changed segments
        env:
          ELEVEN_LABS_API_KEY: ${{ secrets.ELEVEN_LABS_API_KEY }}
        run: |
          python3 curriculum/video/render.py "${{ github.event.inputs.segment || 'all' }}" \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Publish changed renders to YouTube
        env:
          GOOGLE_AUTH_JSON: ${{ secrets.GOOGLE_AUTH_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python3 curriculum/video/publish.py "${{ github.event.inputs.segment || 'all' }}"

      - name: Commit results
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos curriculum/video curriculum/production.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Nothing changed."; exit 0
          fi
          git commit -m "Render and publish segment videos (automated)"
          # another push may have landed meanwhile; rebase our single commit onto it and retry
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            sleep 10
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with the workflow token do not trigger other workflows, so start the Pages deploy.
      - name: Redeploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
